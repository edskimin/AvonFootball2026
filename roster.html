<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avon Eagles Football 2026 — Full Roster</title>
<meta name="description" content="The full 2026 Avon Eagles varsity football roster, sortable by number, name, grade, or position.">
<meta name="theme-color" content="#4B2E83">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Eagles Roster">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preload" href="assets/fonts/bitter-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/opensans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <img class="masthead__mark" src="assets/eagle.png" alt="" width="480" height="205">
    <div class="masthead__text">
      <p class="masthead__eyebrow">2026 Varsity Roster</p>
      <h1 class="masthead__title">Avon Eagles Football</h1>
    </div>
  </div>
  <nav class="tabs" aria-label="Primary">
    <div class="tabs__inner">
      <a class="tab" href="index.html">Lookup</a>
      <a class="tab tab--active" href="roster.html" aria-current="page">Roster</a>
      <a class="tab" href="schedule.html">Schedule</a>
    </div>
  </nav>
</header>

<div class="sortbar" id="sortbar">
  <div class="sortbar__inner">
    <div class="sortbar__row sortbar__row--search">
      <label class="search" for="search-input">
        <span class="visually-hidden">Search players</span>
        <input
          class="search__input"
          id="search-input"
          type="text"
          placeholder="Search name, number, or position"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search">
      </label>
      <button class="search__clear" id="search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="sortbar__row">
      <p class="sortbar__label" id="sortbar-label">By:</p>
      <div class="sortbar__options" role="group" aria-labelledby="sortbar-label">
        <button class="sort-btn" type="button" data-sort="number" aria-pressed="true">Number</button>
        <button class="sort-btn" type="button" data-sort="alpha" aria-pressed="false">A&ndash;Z</button>
        <button class="sort-btn" type="button" data-sort="grade" aria-pressed="false">Grade</button>
        <button class="sort-btn" type="button" data-sort="position" aria-pressed="false">Position</button>
      </div>
    </div>
    <div class="sortbar__row sortbar__row--jump" id="jump-row" hidden>
      <label class="jump" for="jump-select">
        <span class="visually-hidden">Jump to section</span>
        <select class="jump__select" id="jump-select"></select>
      </label>
    </div>
  </div>
</div>

<main class="stack stack--roster" id="roster-list">
  <p class="roster-status" id="roster-status">Loading roster…</p>
</main>

<footer class="site-footer">
  <p>2026 Avon Eagles Varsity Football</p>
  <p class="site-footer__note">Developed by
    <a href="https://www.linkedin.com/in/edskimin" target="_blank" rel="noopener">Ed Skimin</a> of
    <a href="https://www.emergeinc.com" target="_blank" rel="noopener">Emerge Inc.</a>
  </p>
</footer>

<template id="card-template">
  <article class="card card--row">
    <div class="card__num"><span class="card__num-value"></span></div>
    <div class="card__body"></div>
  </article>
</template>

<template id="player-template">
  <div class="player player--row">
    <div class="player__head">
      <h3 class="player__name"></h3>
      <p class="player__pos-inline"></p>
    </div>
    <p class="player__meta"></p>
  </div>
</template>

<template id="section-template">
  <h2 class="section-head">
    <span class="section-head__label"></span>
    <span class="section-head__tag"></span>
    <span class="section-head__count"></span>
  </h2>
</template>

<script src="roster.js"></script>
</body>
</html>
